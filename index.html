<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKD Earn - Play & Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://app.adsgram.ai/js/adsgram-ad-sdk.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // আপনার Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAsyiJKWIH3ddyBt9vTJ5iB9PZeOTCdNMc",
            authDomain: "pkdearnbot.firebaseapp.com",
            databaseURL: "https://pkdearnbot-default-rtdb.firebaseio.com",
            projectId: "pkdearnbot",
            storageBucket: "pkdearnbot.firebasestorage.app",
            messagingSenderId: "433740946045",
            appId: "1:433740946045:web:87092621058d5ebc2a2f14",
            measurementId: "G-JQDDD3YKSG"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let tg = window.Telegram.WebApp;
        tg.expand();

        let userId = tg.initDataUnsafe.user?.id || "guest_user";
        const userRef = ref(db, 'users/' + userId);

        // ব্যালেন্স লোড করা
        function loadBalance() {
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    document.getElementById('balance').innerText = snapshot.val().balance + " Coins";
                } else {
                    set(userRef, { balance: 0, name: tg.initDataUnsafe.user?.first_name || "User" });
                    document.getElementById('balance').innerText = "0 Coins";
                }
            });
        }

        loadBalance();

        // Adsgram Setup (আপনার আইডি ২৭২৫৭ বসানো হয়েছে)
        const AdController = window.Adsgram.init({ blockId: "27257" });

        window.showAd = function() {
            AdController.show().then((result) => {
                get(userRef).then((snapshot) => {
                    let currentBalance = snapshot.val()?.balance || 0;
                    let newBalance = currentBalance + 10;
                    
                    update(userRef, { balance: newBalance });
                    document.getElementById('balance').innerText = newBalance + " Coins";
                    alert("অভিনন্দন! আপনি ১০ কয়েন পেয়েছেন।");
                });
            }).catch((result) => {
                alert("বিজ্ঞাপন লোড হয়নি বা আপনি স্কিপ করেছেন।");
                console.log("Adsgram error:", result);
            });
        };
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0c29; color: white; text-align: center; margin: 0; padding: 20px; }
        .card { background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29); border-radius: 20px; padding: 40px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-top: 50px; }
        h1 { font-size: 28px; margin-bottom: 10px; color: #4ecca3; }
        #balance { font-size: 45px; font-weight: bold; margin: 20px 0; color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .btn { background: #e94560; color: white; border: none; padding: 15px 30px; font-size: 20px; border-radius: 50px; cursor: pointer; transition: 0.3s; width: 85%; max-width: 280px; font-weight: bold; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4); }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="card">
        <h1>PKD EARN</h1>
        <p>Your Current Balance</p>
        <div id="balance">Loading...</div>
        <button class="btn" onclick="showAd()">WATCH AD & EARN</button>
    </div>

</body>
</html>
